name: Documentation

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/validate_docs.py"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "scripts/validate_docs.py"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate documentation structure and links
        run: python3 scripts/validate_docs.py
